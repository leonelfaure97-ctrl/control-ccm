<!DOCTYPE html>

<style>
@media(max-width:768px){thead{display:none}table,tbody,tr,td{display:block;width:100%}tr{margin:0 0 .75rem;background:#1e293b;border:1px solid #334155;border-radius:.75rem;padding:.75rem}td{display:flex;justify-content:space-between;gap:.5rem;text-align:right;padding:.4rem 0;border-bottom:1px solid #33415566}td:before{content:attr(data-l);color:#94a3b8;text-align:left}td:last-child{border:0;justify-content:center;flex-wrap:wrap}td:last-child:before{content:none}}

<body class="bg-slate-900 text-slate-100 min-h-screen">

<div id="app" class="min-h-screen flex flex-col">
<header class="bg-[#002B7F] px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow" style="padding-top:max(.75rem,env(safe-area-inset-top))">
<div class="flex items-center gap-3"><div class="bg-white rounded-lg p-1.5"><img src="logo.jpg" alt="Molinos Agro" class="h-8"></div>
<div><h1 id="titulo" class="font-bold">Gestión de Cubicles y CCM</h1><p class="text-xs text-blue-200">Mantenimiento eléctrico de planta</p></div></div>
<div class="flex items-center gap-2 flex-wrap text-sm">
<span id="st" class="text-xs px-3 py-1 rounded-full border"></span>

<button id="b-termo" data-act="vista" data-id="termo" class="px-3 py-2 rounded-lg border border-slate-700 bg-slate-800">🌡 Termografía</button>
<button data-act="nuevo" class="px-3 py-2 rounded-lg bg-[#1E7333] hover:bg-green-700 font-semibold">+ Nuevo</button>
<label class="px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 cursor-pointer">📊 Excel<input id="xl" type="file" accept=".xlsx,.xls,.csv" class="hidden"></label>
</div></header>
<section class="bg-slate-800/80 border-b border-slate-700 px-4 py-3 grid md:grid-cols-3 gap-3">
<input id="q" placeholder="Buscar por Tag, Cubicle, CCM o Potencia..." class="md:col-span-2 w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
<select id="fccm" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm"></select>
</section>
<main class="flex-1 p-4">
<div id="v-ccm" class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden"><table class="w-full text-left text-sm">
<thead><tr class="bg-slate-900/80 text-slate-400 text-xs uppercase"><th class="p-3">Tag</th><th class="p-3">Cubicle</th><th class="p-3">CCM</th><th class="p-3">Potencia</th><th class="p-3">I Nom.</th><th class="p-3">Arranque</th><th class="p-3 text-center">Acciones</th></tr></thead>
<tbody id="tb-ccm" class="divide-y divide-slate-700/50"></tbody></table></div>
<div id="v-termo" class="hidden bg-slate-800 border border-slate-700 rounded-xl overflow-hidden"><table class="w-full text-left text-sm">
<thead><tr class="bg-slate-900/80 text-slate-400 text-xs uppercase"><th class="p-3">Tablero</th><th class="p-3">Columna</th><th class="p-3">Equipo</th><th class="p-3 text-center">Fase</th><th class="p-3">Temp</th><th class="p-3">N° foto</th><th class="p-3">Observaciones</th><th class="p-3 text-center">Imagen</th><th class="p-3 text-center">Acciones</th></tr></thead>
<tbody id="tb-termo" class="divide-y divide-slate-700/50"></tbody></table></div>
</main></div>
<div id="modal" class="hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDi_vtxaFeAPeBoe2cupyrKIChrmKX-2RU",authDomain:"control-ccm.firebaseapp.com",databaseURL:"https://control-ccm-default-rtdb.firebaseio.com",projectId:"control-ccm",storageBucket:"control-ccm.firebasestorage.app",messagingSenderId:"14150602796",appId:"1:14150602796:web:649438a05f51a0c6ecc189"});
// Caché persistente: los datos quedan en el dispositivo y las escrituras sin red se sincronizan solas
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const col=n=>collection(db,n),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const fmtT=v=>{v=String(v??'').trim();return /^[\d.,]+$/.test(v)?v+' °C':v};
const S={equipos:[],termos:[],notas:[]};let vista='ccm',cur=null,fichaId=null,tmpImg='',un=[];
const fail=e=>{console.error(e);alert('No se pudo guardar: '+e.message)};
const inp='w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm';
const ARR=['Directo (DOL)','Estrella - Triángulo','Arrancador Suave (Soft Starter)','Variador de Frecuencia (VFD)'];
const FUS=['','NH00','NH0','NH1','NH2','NH3','Cilíndrico 10x38','Cilíndrico 14x51','Cilíndrico 22x58','Otro'];
const FC=[['tag','Tag del equipo *'],['cubicle','Cubicle *'],['ccm','CCM *'],['sector','Sector / Área'],['potencia','Potencia (kW / HP)'],['inominal','Corriente nominal (A)'],['fusibleTipo','Tipo de fusible','select',FUS],['fusibleAmp','Calibre fusible (A)'],['arranque','Tipo de arranque','select',ARR],['notas','Notas','area']];
const FT=[['tablero','Tablero *'],['columna','Columna *'],['equipo','Equipo *'],['temp','Temperatura *'],['foto','N° de foto'],['observaciones','Observaciones','area']];

function modal(h,k=''){const m=$('#modal');m.dataset.k=k;m.className='fixed inset-0 bg-slate-950/80 flex justify-center items-center p-4 z-50';m.innerHTML='<div class="bg-slate-800 border border-slate-700 w-full max-w-xl rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto p-5 space-y-3">'+h+'</div>'}
function closeModal(){fichaId=null;$('#modal').className='hidden';$('#modal').innerHTML=''}
function field([k,l,t,o],v){v=v??'';const id='f_'+k;const c=t==='select'?`<select id="${id}" class="${inp}">${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:t==='area'?`<textarea id="${id}" rows="2" class="${inp}">${esc(v)}</textarea>`:`<input id="${id}" value="${esc(v)}" class="${inp}">`;return `<div><label class="block text-xs text-slate-400 mb-1">${l}</label>${c}</div>`}
const get=F=>Object.fromEntries(F.map(f=>[f[0],$('#f_'+f[0]).value.trim()]));
const head=(t,c='text-green-400')=>`<div class="flex justify-between items-center"><h3 class="font-bold ${c}">${t}</h3><button data-act="cerrar" class="text-slate-400">✕</button></div>`;
const btns=(a,id,txt)=>`<div class="flex justify-end gap-2 pt-2"><button data-act="cerrar" class="px-4 py-2 rounded-lg text-sm bg-slate-700">Cancelar</button><button data-act="${a}" data-id="${id||''}" class="px-4 py-2 rounded-lg text-sm bg-[#1E7333] font-semibold">${txt}</button></div>`;

function comprimir(f,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.src=r.result};r.readAsDataURL(f)})}

function render(){
 const q=norm($('#q').value);
 if(vista==='ccm'){
  const sel=$('#fccm'),v=sel.value,cc=[...new Set(S.equipos.map(e=>e.ccm).filter(Boolean))].sort();
  sel.innerHTML='<option value="">Todos los CCM</option>'+cc.map(c=>`<option ${c===v?'selected':''}>${esc(c)}</option>`).join('');
  const l=S.equipos.filter(e=>(!sel.value||e.ccm===sel.value)&&norm([e.tag,e.cubicle,e.ccm,e.potencia].join(' ')).includes(q)).sort((a,b)=>String(a.tag).localeCompare(String(b.tag),'es',{numeric:true}));
  $('#tb-ccm').innerHTML=l.length?l.map(e=>`<tr class="hover:bg-slate-700/30 cursor-pointer" data-act="ficha" data-id="${e.id}"><td data-l="Tag" class="p-3 font-semibold text-green-400">${esc(e.tag)}</td><td data-l="Cubicle" class="p-3">${esc(e.cubicle)}</td><td data-l="CCM" class="p-3">${esc(e.ccm)}</td><td data-l="Potencia" class="p-3">${esc(e.potencia)}</td><td data-l="I Nom." class="p-3">${esc(e.inominal)}</td><td data-l="Arranque" class="p-3"><span class="bg-slate-700/50 px-2 py-1 rounded text-xs">${esc(e.arranque)}</span></td><td class="p-3 text-center"><button data-act="editEq" data-id="${e.id}" class="bg-slate-700 text-green-400 px-2.5 py-1.5 rounded-lg text-xs">Editar</button> <button data-act="delEq" data-id="${e.id}" class="bg-slate-700 text-red-400 px-2.5 py-1.5 rounded-lg text-xs">Eliminar</button></td></tr>`).join(''):'<tr><td class="p-8 text-center text-slate-400">No hay equipos. Cargá un Excel o agregá uno nuevo.</td></tr>';
 }else{
  const l=S.termos.filter(t=>norm([t.tablero,t.columna,t.equipo,t.observaciones].join(' ')).includes(q)).sort((a,b)=>String(a.tablero).localeCompare(String(b.tablero),'es',{numeric:true}));
  $('#tb-termo').innerHTML=l.length?l.map(t=>{const f=t.fases||{},b=(x,c)=>`<span class="px-1.5 rounded ${f[x]?c+' text-white font-bold':'bg-slate-800 text-slate-500'}">${x.toUpperCase()}</span>`;
   return `<tr><td data-l="Tablero" class="p-3 font-semibold text-amber-400">${esc(t.tablero)}</td><td data-l="Columna" class="p-3">${esc(t.columna)}</td><td data-l="Equipo" class="p-3">${esc(t.equipo)}</td><td data-l="Fase" class="p-3 text-center font-mono text-xs">${b('r','bg-red-600')} ${b('s','bg-amber-600')} ${b('t','bg-blue-600')}</td><td data-l="Temp" class="p-3 font-bold">${esc(fmtT(t.temp))||'-'}</td><td data-l="N° foto" class="p-3 font-mono text-xs">${esc(t.foto)||'-'}</td><td data-l="Obs." class="p-3 text-xs">${esc(t.observaciones)||'-'}</td><td data-l="Imagen" class="p-3 text-center">${t.imagen?`<button data-act="img" data-id="${t.id}" class="bg-slate-700 text-amber-300 px-2.5 py-1 rounded text-xs">Ver foto</button>`:'<span class="text-xs text-slate-500">Sin imagen</span>'}</td><td class="p-3 text-center"><button data-act="editT" data-id="${t.id}" class="bg-slate-700 text-amber-400 px-2.5 py-1.5 rounded-lg text-xs">Editar</button> <button data-act="delT" data-id="${t.id}" class="bg-slate-700 text-red-400 px-2.5 py-1.5 rounded-lg text-xs">Eliminar</button></td></tr>`}).join(''):'<tr><td class="p-8 text-center text-slate-400">No hay registros termográficos.</td></tr>';
 }
 if(fichaId)A.ficha(fichaId);
}

const rel=(t,e)=>{const tag=String(e.tag||'').toLowerCase();return tag&&[t.equipo,t.columna,t.tablero].some(x=>String(x||'').toLowerCase().split(/[\s,;/()]+/).includes(tag))};
const A={
 vista(v){vista=v;$('#v-ccm').classList.toggle('hidden',v!=='ccm');$('#v-termo').classList.toggle('hidden',v!=='termo');$('#fccm').classList.toggle('hidden',v!=='ccm');
  for(const x of['ccm','termo']){$('#b-'+x).classList.toggle('bg-blue-600',x===v);$('#b-'+x).classList.toggle('bg-slate-800',x!==v)}
  $('#titulo').textContent=v==='ccm'?'Gestión de Cubicles y CCM':'Inspección Termográfica';$('#q').placeholder=v==='ccm'?'Buscar por Tag, Cubicle, CCM o Potencia...':'Buscar por Tablero, Columna, Equipo u Observaciones...';render()},
 nuevo(){vista==='ccm'?A.editEq():A.editT()},
 cerrar:closeModal,
 editEq(id){const e=S.equipos.find(x=>x.id===id)||{arranque:ARR[0]};fichaId=null;modal(head(id?'Editar equipo':'Nuevo equipo')+'<div class="grid grid-cols-2 gap-3">'+FC.map(f=>field(f,e[f[0]])).join('')+'</div>'+btns('saveEq',id,'Guardar'))},
 saveEq(id){const d=get(FC);if(!d.tag||!d.cubicle||!d.ccm)return alert('Completá Tag, Cubicle y CCM.');
  (id?updateDoc(doc(db,'equipos_ccm',id),d):addDoc(col('equipos_ccm'),d)).catch(fail);closeModal()},
 delEq(id){if(confirm('¿Eliminar este equipo?'))deleteDoc(doc(db,'equipos_ccm',id)).catch(fail)},
 ficha(id){const e=S.equipos.find(x=>x.id===id);if(!e)return closeModal();fichaId=id;
  const k=(l,v)=>`<div><span class="text-slate-400 text-xs block">${l}</span><b>${esc(v)||'-'}</b></div>`,tag=String(e.tag||'').toLowerCase();
  const ns=S.notas.filter(n=>String(n.tag||'').toLowerCase()===tag).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const ts=S.termos.filter(t=>rel(t,e));
  modal(head('⚡ '+esc(e.tag))+`<div class="grid grid-cols-2 gap-3 bg-slate-900 p-3 rounded-xl text-sm">${k('Cubicle',e.cubicle)}${k('CCM',e.ccm)}${k('Sector',e.sector)}${k('Arranque',e.arranque)}${k('Potencia',e.potencia)}${k('I nominal',e.inominal)}${k('Fusible',e.fusibleTipo)}${k('Calibre fusible',e.fusibleAmp)}</div>${e.notas?`<p class="text-xs italic text-slate-300">${esc(e.notas)}</p>`:''}
  <div class="flex justify-between items-center"><b class="text-sm">Historial</b><button data-act="nota" data-id="${id}" class="bg-[#1E7333] px-3 py-1.5 rounded-lg text-xs">+ Nota / reparación</button></div>`
  +ns.map(n=>`<div class="bg-slate-900 border border-green-900/50 p-3 rounded-xl text-xs space-y-1"><div class="flex justify-between"><b class="text-green-300">🔧 ${esc(n.titulo)}</b><span class="font-mono text-slate-400">${esc(n.fecha)}</span></div><p class="text-slate-300">${esc(n.detalle)}</p><button data-act="delN" data-id="${n.id}" class="text-slate-500 hover:text-red-400">Eliminar nota</button></div>`).join('')
  +ts.map(t=>{const f=t.fases||{};return `<div class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs space-y-1"><div class="flex justify-between"><b class="text-amber-400">🌡 ${esc(t.tablero)} / ${esc(t.columna)}</b><span class="font-mono text-amber-300">${esc(fmtT(t.temp))}</span></div><div>Equipo: ${esc(t.equipo)} · Foto: ${esc(t.foto)||'-'} · Fases: ${['r','s','t'].filter(x=>f[x]).join(' ').toUpperCase()||'-'}</div>${t.observaciones?`<p class="italic text-slate-400">${esc(t.observaciones)}</p>`:''}${t.imagen?`<button data-act="img" data-id="${t.id}" class="text-amber-400 underline">Ver foto</button>`:''}</div>`}).join('')
  +(ns.length||ts.length?'':'<p class="text-center text-slate-400 py-4 text-sm">Sin registros para este equipo todavía.</p>'),'ficha')},
 nota(id){cur=S.equipos.find(x=>x.id===id);fichaId=null;modal(head('Nueva nota / reparación')+`<div><label class="text-xs text-slate-400">Fecha *</label><input id="n_f" type="date" value="${new Date().toISOString().slice(0,10)}" class="${inp}"></div><div><label class="text-xs text-slate-400">Título *</label><input id="n_t" placeholder="Ej: Cambio de rodamientos" class="${inp}"></div><div><label class="text-xs text-slate-400">Detalle *</label><textarea id="n_d" rows="3" class="${inp}"></textarea></div>`+btns('saveN',id,'Guardar nota'))},
 saveN(id){const d={tag:cur.tag,fecha:$('#n_f').value,titulo:$('#n_t').value.trim(),detalle:$('#n_d').value.trim()};if(!d.titulo||!d.detalle)return alert('Completá título y detalle.');
  addDoc(col('historial_equipos'),d).catch(fail);A.ficha(id)},
 delN(id){if(confirm('¿Eliminar esta nota?'))deleteDoc(doc(db,'historial_equipos',id)).catch(fail)},
 editT(id){const t=S.termos.find(x=>x.id===id)||{},f=t.fases||{};fichaId=null;tmpImg=t.imagen||'';
  modal(head(id?'Editar inspección':'Nueva inspección','text-amber-400')+'<div class="grid grid-cols-2 gap-3">'+FT.map(x=>field(x,t[x[0]])).join('')+`</div><div class="flex gap-2 text-xs">${['r','s','t'].map(x=>`<label class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2"><input type="checkbox" id="p_${x}" ${f[x]?'checked':''}> Fase ${x.toUpperCase()}</label>`).join('')}</div><div class="border-t border-slate-700 pt-3"><label class="text-xs text-amber-400">Imagen térmica (FLIR)</label><input id="p_img" type="file" accept="image/*" class="block text-xs mt-1"><img id="p_prev" src="${esc(tmpImg)}" class="${tmpImg?'':'hidden '}mt-2 max-h-40 rounded-lg"></div>`+btns('saveT',id,'Guardar inspección'));
  $('#p_img').onchange=async e=>{const f=e.target.files[0];if(!f)return;let d=await comprimir(f,1000,.65);if(d.length>800000)d=await comprimir(f,700,.5);tmpImg=d;$('#p_prev').src=d;$('#p_prev').classList.remove('hidden')}},
 saveT(id){const d=get(FT);if(!d.tablero||!d.columna||!d.equipo||!d.temp)return alert('Completá Tablero, Columna, Equipo y Temperatura.');
  d.temp=fmtT(d.temp);d.fases={r:$('#p_r').checked,s:$('#p_s').checked,t:$('#p_t').checked};d.imagen=tmpImg;
  (id?updateDoc(doc(db,'termografias',id),d):addDoc(col('termografias'),d)).catch(fail);closeModal()},
 delT(id){if(confirm('¿Eliminar esta inspección?'))deleteDoc(doc(db,'termografias',id)).catch(fail)},
 img(id){const t=S.termos.find(x=>x.id===id);if(t?.imagen){fichaId=null;modal(head('Imagen térmica','text-amber-400')+`<img src="${esc(t.imagen)}" class="max-w-full rounded-lg mx-auto">`)}}
};
document.addEventListener('click',e=>{if(e.target.id==='modal')return closeModal();const b=e.target.closest('[data-act]');if(b)A[b.dataset.act]?.(b.dataset.id)});
$('#q').oninput=render;$('#fccm').onchange=render;

// Importación desde Excel / CSV
const MC={tag:['tag','tagequipo','equipo'],cubicle:['cubicle'],ccm:['ccm'],sector:['sector','area','sectorarea'],potencia:['potencia'],inominal:['inominal','inom','corrientenominal','corriente'],arranque:['arranque','tipodearranque'],fusibleTipo:['fusibletipo','tipodefusible','tipodefusibles','fusible'],fusibleAmp:['fusibleamp','calibre','calibrefusible'],notas:['notas']};
const MT={tablero:['tablero'],columna:['columna'],equipo:['equipo'],temp:['temp','temperatura'],foto:['ndefoto','foto','nfoto','nrofoto'],observaciones:['observaciones','obs']};
const pick=(r,al)=>{for(const k in r)if(al.includes(norm(k)))return String(r[k]).trim();return''};
// Termografía desde .xlsx: las fases con relleno verde en R, S o T son las marcadas
function verde(c){const f=c.fill,k=f&&f.type==='pattern'&&f.pattern!=='none'&&f.fgColor;if(!k||!k.argb)return false;const h=k.argb.slice(-6),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return g>r+30&&g>b+30}
async function importTermoXlsx(f){
 const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());const ws=wb.worksheets[0];let hr=0,H={};
 ws.eachRow((row,n)=>{if(hr)return;const m={};row.eachCell({includeEmpty:false},(c,i)=>{const k=norm(c.text);if(k&&!(k in m))m[k]=i});if(m.tablero){hr=n;H=m}});
 if(!hr)throw new Error('No encontré la fila de encabezados (TABLERO, COLUMNA, EQUIPO...).');
 const fc=H.fase??H.r,ex=new Set(S.termos.map(x=>norm([x.tablero,x.columna,x.equipo,x.foto].join()))),out=[];let marc=0,dup=0;
 for(let n=hr+1;n<=ws.rowCount;n++){const row=ws.getRow(n),g=k=>H[k]?row.getCell(H[k]).text.trim():'';
  const d={tablero:g('tablero'),columna:g('columna'),equipo:g('equipo'),foto:g('ndefoto')||g('foto'),observaciones:g('observaciones')};
  if(!d.tablero&&!d.equipo)continue;
  d.temp=fmtT(g('temp'));
  d.fases=fc?{r:verde(row.getCell(fc)),s:verde(row.getCell(fc+1)),t:verde(row.getCell(fc+2))}:{r:false,s:false,t:false};
  const key=norm([d.tablero,d.columna,d.equipo,d.foto].join());if(ex.has(key)){dup++;continue}ex.add(key);
  if(d.fases.r||d.fases.s||d.fases.t)marc++;out.push(d)}
 for(let i=0;i<out.length;i+=400){const b=writeBatch(db);out.slice(i,i+400).forEach(d=>b.set(doc(col('termografias')),d));b.commit().catch(fail)}
 alert(`${out.length} inspecciones cargadas, ${marc} con fases marcadas en verde.`+(dup?`\n${dup} repetidas omitidas.`:'')+(out.length&&!marc?'\nNo se detectó ninguna celda verde en R, S o T. Revisá que el color sea un relleno directo de la celda.':''))}
$('#xl').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 if(vista==='termo'&&/\.xlsx$/i.test(f.name))return importTermoXlsx(f).catch(x=>alert('No se pudo importar: '+x.message));
 try{const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const ccm=vista==='ccm',M=ccm?MC:MT,c=ccm?'equipos_ccm':'termografias',ex=new Set(S.equipos.map(x=>norm(x.tag+x.cubicle))),out=[];
  for(const r of rows){const d={};for(const k in M)d[k]=pick(r,M[k]);
   if(ccm){if(!d.tag)continue;const key=norm(d.tag+d.cubicle);if(ex.has(key))continue;ex.add(key);d.arranque=d.arranque||ARR[0]}
   else{if(!d.tablero&&!d.equipo)continue;d.fases={r:false,s:false,t:false};d.temp=fmtT(d.temp)}
   out.push(d)}
  for(let i=0;i<out.length;i+=400){const b=writeBatch(db);out.slice(i,i+400).forEach(d=>b.set(doc(col(c)),d));b.commit().catch(fail)}
  alert(`${out.length} registros cargados de ${rows.length} filas (los duplicados se omiten).`+(ccm?'':'\nCon .xls/.csv no se leen los colores de las fases: guardá la planilla como .xlsx.'))}catch(x){fail(x)}};

// Datos en tiempo real (sin login por ahora)
[['equipos_ccm','equipos'],['termografias','termos'],['historial_equipos','notas']].forEach(([c,k])=>onSnapshot(col(c),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(c,e)));
function st(){const o=navigator.onLine;$('#st').textContent=o?'● En línea':'● Sin conexión';$('#st').className='text-xs px-3 py-1 rounded-full border '+(o?'bg-emerald-950 text-emerald-400 border-emerald-800':'bg-amber-950 text-amber-300 border-amber-800')}
addEventListener('online',st);addEventListener('offline',st);st();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
